name: Mise à jour des Podcasts

on:
  schedule:
    # Lance le script tous les jours à 6h00 UTC (7h ou 8h en France)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permet de le lancer manuellement depuis l'interface GitHub si besoin

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Important pour pouvoir sauvegarder le fichier json

    steps:
    - name: Checkout du code
      uses: actions/checkout@v3

    - name: Configurer Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install feedparser

    - name: Lancer le script de récupération
      run: python scripts/fetch_episodes.py

    - name: Commit et Push si changement
      run: |
        git config --global user.name 'GitHub Action Bot'
        git config --global user.email 'action@github.com'
        git add assets/data/episodes.json
        # Ne commit que s'il y a des changements pour éviter les erreurs
        git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique des épisodes RSS" && git push)